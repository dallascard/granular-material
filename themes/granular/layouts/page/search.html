{{ partial "head.html" . }}
<div class="site-wrap">
  {{ partial "header.html" . }}
  <div class="post p2 p-responsive wrap" role="main">
    <div class="measure">
      <div class="post-header mb2">
        <h1 class="py2">{{ .Title }}</h1>
      </div>
      <div id="search"></div>
    </div>
  </div>
</div>
<!-- The pagefind/ bundle is generated after the Hugo build; see .github/workflows/gh-pages.yml -->
<script src="{{ "pagefind/pagefind-ui.js" | relURL }}"></script>
<script>
  window.addEventListener("DOMContentLoaded", function () {
    new PagefindUI({ element: "#search", showImages: false, showSubResults: true, autofocus: true });
  });
</script>
{{ partial "footer.html" . }}
