baseURL: https://dallascard.github.io/granular-material/
locale: en-us
title: Granular Material
theme: granular

smartDashes: true

relativeurls: true
canonifyurls: true
contentDir: "content"

taxonomies:
    tag: "tags"

params:
    mainSections: ["post"]
    # Used for link previews of the home page and other non-post pages.
    description: "Exploring topics related to science, technology, and culture in slightly more detail than is reasonable."
    bsky_username: "dallascard.bsky.social"
    paginate: 10
    google_analytics_id: "G-EL45TK68M9"
    author:
        name: "Dallas Card"

markup:
  goldmark:
    renderer:
      unsafe: true

security:
  allowContent:
    - "^text/markdown$"
    - "^text/html$"


